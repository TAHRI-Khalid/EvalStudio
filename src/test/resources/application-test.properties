spring.application.name=eval_desktop_test

# Threads virtuels
spring.threads.virtual.enabled=true

# Base H2 in-memory pour les tests d'intégration sans dépendance réseau ou conflit de fichier
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate DDL
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Configuration artefacts & modèles
eval.document.upload-dir=upload
eval.document.model-path=model/eval_model.onnx
