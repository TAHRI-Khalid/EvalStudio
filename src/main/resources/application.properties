spring.application.name=eval_desktop

# Threads virtuels Java 21+
spring.threads.virtual.enabled=true

# Base de donnees H2 locale en mode fichier (resolue via app.dir defini dynamiquement par AppPaths)
spring.datasource.url=jdbc:h2:file:${app.dir:.}/data/evaldb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate DDL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Package document & artefacts des evaluations
eval.document.upload-dir=${app.dir:.}/upload
eval.document.model-path=${app.dir:.}/model/eval_model.onnx
